<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go RSS Aggregator Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>RSS Aggregator Dashboard</h1>
        <div class="auth-box">
            <label for="apiKey">Active API Key:</label>
            <input type="text" id="apiKey" placeholder="User ApiKey will auto-fill or can be pasted here">
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h2>1. User </h2> <!--/v1/users-->
            <div class="form-group">
                <input type="text" id="usernameInput" placeholder="Enter New Username">
                <button id="btnCreateUser">Register User</button>
            </div>
            <div id="userResult" class="meta-info"></div>
        </section>

        <section class="card">
            <h2>2. Create New Feed Channel </h2>  <!--/v1/feeds-->
            <div class="form-group">
                <input type="text" id="feedNameInput" placeholder="Feed Name (e.g., TechCrunch)">
                <input type="text" id="feedUrlInput" placeholder="RSS Link URL (e.g., https://site.com/rss)">
                <button id="btnCreateFeed">Register Feed</button>
            </div>
        </section>

        <section class="card">
            <h2>3. Global Public Directory </h2>   <!--/v1/feeds-->
            <button id="btnFetchPublicFeeds">Load Global Channels</button>
            <ul id="publicFeedsList" class="list-container"></ul>
        </section>

        <section class="card">
            <h2>4. Target & Follow Feed </h2>     <!--/v1/feed_follows-->
            <div class="form-group">
                <input type="text" id="feedIdInput" placeholder="Paste target Feed UUID code here">
                <button id="btnFollow">Follow Channel</button>
            </div>
        </section>

        <section class="card full-width">
            <h2>5. Your Subscriptions Dashboard </h2> <!--/v1/feed_follows-->
            <button id="btnFetchFollows" class="primary-btn">Refresh My Active Follows</button>
            <ul id="followsList" class="list-container"></ul>
        </section>
        <section class="card full-width">
            <h2>6. Your Personalized Article Feed </h2>
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="postLimitInput">Limit posts:</label>
                <input type="number" id="postLimitInput" value="10" style="width: 80px; max-width: 80px;">
                <button id="btnFetchPosts" class="primary-btn" style="background: #04d361;">Fetch Latest Articles</button>
            </div>
            <div id="postsStreamContainer" class="posts-grid">
                <p style="color: #737380;">Click the button above to load your subscribed stream.</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
